# Builds the feat/alt-report-storage-s3 branch and pushes a multi-arch image to GHCR.
# Re-run the workflow to rebuild from the latest commit of that branch.
name: GHCR image

on:
  push:
    branches:
      - ci/ghcr-image

permissions: {}

env:
  SOURCE_REF: feat/alt-report-storage-s3
  IMAGE: ghcr.io/${{ github.repository_owner }}/trivy-operator

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # was: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: jsonv2
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "bin/$arch/trivy-operator" ./cmd/trivy-operator/main.go
          done
          awk '/^COPY trivy-operator /{print "ARG TARGETARCH"; sub(/COPY trivy-operator /, "COPY ${TARGETARCH}/trivy-operator ")} {print}' \
            build/trivy-operator/Dockerfile > bin/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # was: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # was: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # was: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          sha="$(git rev-parse --short HEAD)"
          docker buildx build bin \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "${IMAGE}:s3" \
            --tag "${IMAGE}:s3-${sha}" \
            --push
          echo "Pushed ${IMAGE}:s3 and ${IMAGE}:s3-${sha}" >> "$GITHUB_STEP_SUMMARY"
